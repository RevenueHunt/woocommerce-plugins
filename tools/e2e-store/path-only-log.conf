# Mounted by compose.yml: access log lines with the path only. Query strings and referrers carry credentials here
# (WooCommerce's query-string REST auth with the store's keys, the shop API key in prq_set_token).
LogFormat "%a %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" combined
LogFormat "%v:%p %a %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" vhost_combined
# The error log too: by default each line (a PHP warning, say) ends with the request's referrer.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P] [client\ %a] %M"
